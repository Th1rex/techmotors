# Render Blueprint — TechMotors
# Docs: https://render.com/docs/blueprint-spec
#
# Este arquivo permite criar o serviço automaticamente pelo Render
# (Dashboard > New > Blueprint > selecione este repositório).
#
# PLANO FREE: o disco do serviço é temporário. O banco SQLite volta aos
# dados de teste (seed) a cada deploy, reinício ou quando o serviço "dorme"
# após 15 minutos sem acesso (ele leva cerca de 1 minuto para acordar).
# Para a apresentação, abra o site alguns minutos antes.

services:
  - type: web
    name: techmotors
    runtime: node
    plan: free
    region: oregon # troque para a região mais próxima, se preferir
    rootDir: backend # o app (package.json) fica em backend/
    # --include=dev é obrigatório: com NODE_ENV=production o npm pula as
    # devDependencies, e sem o TypeScript o "npm run build" (tsc) falha
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /

    # Para os dados não sumirem, troque "plan: free" por "plan: starter"
    # (pago) e descomente o disco abaixo e a variável DB_PATH.
    # disk:
    #   name: techmotors-data
    #   mountPath: /var/data
    #   sizeGB: 1

    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      # Caminho do SQLite no disco persistente (somente com plano pago + disco)
      # - key: DB_PATH
      #   value: /var/data/techmotors.db
      # JWT_SECRET: o Render gera um valor aleatório e seguro
      - key: JWT_SECRET
        generateValue: true
      # Restrinja o CORS ao seu domínio em produção (ex.: https://techmotors.onrender.com)
      - key: CORS_ORIGIN
        sync: false
      # Configuração de e-mail (opcional — recuperação de senha)
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
